# A generic single-database configuration.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present. Default is current working directory.
prepend_sys_path = .

# timezone to use when rendering the migration file
# leave blank for local timezone
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
sourceless = false

# version location specification; This defaults to alembic/versions.
# version_locations = %(here)s/alembic/versions

# set to 'true' to search source files recursively in each "version_locations" directory
recursive_version_locations = false

# the output encoding used when revision files are written from script.py.mako
output_encoding = utf-8


sqlalchemy.url = postgresql://user:pass@localhost/dbname
