# ═══════════════════════════════════════════════
# EOS Platform — Pytest Configuration
# Phase 1: Automated Testing Framework
# ═══════════════════════════════════════════════

[tool.pytest.ini_options]
# Async support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output formatting
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--color=yes"
]

# Markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security-related",
    "tenant_isolation: marks tests for multi-tenancy validation",
    "phase0: Phase 0 - Smoke tests",
    "phase1: Phase 1 - Stability and testing",
    "phase2: Phase 2 - Architecture deduplication",
    "phase3: Phase 3 - Security and compliance",
    "phase4: Phase 4 - Documentation",
    "phase5: Phase 5 - Product completion"
]

# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning"
]
