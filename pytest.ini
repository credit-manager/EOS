# EOS Platform — Pytest Configuration
# Phase 1: Automated Testing Framework

[pytest]
# Async support
asyncio_mode = auto

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude manual production certification scripts from pytest collection.
# These scripts target live production-style services and rebind stdout at import time.
# They remain available for explicit/manual certification runs.
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --color=yes
    --ignore=tests/test_final_analysis.py
    --ignore=tests/test_custom.py
    --ignore=tests/test_approve.py
    --ignore=tests/test_notify.py
    --ignore=tests/test_services.py
    --ignore=tests/test_retail_commerce.py
    --ignore=tests/test_manufacturing.py
    --ignore=tests/test_commerce_engine.py
    --ignore=tests/test_p707b.py
    --ignore=tests/test_p72_2.py
    --ignore=tests/test_p72_full.py
    --ignore=tests/test_p73_final.py
    --ignore=tests/test_p73_infra.py
    --ignore=tests/test_p73_security.py
    --ignore=tests/test_p73_ux.py
    --ignore=tests/test_p76_deploy.py
    --ignore=tests/test_p77_commercial.py
    --ignore=tests/test_p78_review.py
    --ignore=tests/test_p80_5b_critical.py
    --ignore=tests/test_p80_5c_high.py
    --ignore=tests/test_p80_critical.py
    --ignore=tests/test_p81_payments.py
    --ignore=tests/test_p82_85.py

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security-related
    tenant_isolation: marks tests for multi-tenancy validation
    e2e: marks end-to-end tests
    requires_db: marks tests requiring a database connection
    requires_redis: marks tests requiring Redis
    industry_tourism: tourism industry pack tests
    industry_construction: construction industry pack tests
    phase0: Phase 0 - Smoke tests
    phase1: Phase 1 - Stability and testing
    phase2: Phase 2 - Architecture deduplication
    phase3: Phase 3 - Security and compliance
    phase4: Phase 4 - Documentation
    phase5: Phase 5 - Product completion

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
