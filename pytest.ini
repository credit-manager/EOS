# EOS Platform — Pytest Configuration
# Pytest-native suites use the pytest_*.py naming convention.
# Legacy test_*.py files in this repository are manual/integration scripts and
# must not execute at import/collection time.

[pytest]
asyncio_mode = auto

testpaths = tests
python_files = pytest_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --color=yes

markers =
    slow: marks tests requiring external services or database state
    integration: marks tests requiring external services or database state
    unit: marks fast isolated unit tests
    security: marks tests that validate security controls
    tenant_isolation: marks tests for multi-tenancy validation
    e2e: marks end-to-end tests
    requires_db: marks tests requiring a database connection
    requires_redis: marks tests requiring Redis
    industry_tourism: marks tourism industry pack tests
    industry_construction: marks construction industry pack tests
    phase0: Phase 0 - Smoke tests
    phase1: Phase 1 - Stability and testing
    phase2: Phase 2 - Architecture deduplication
    phase3: Phase 3 - Security and compliance
    phase4: Phase 4 - Documentation
    phase5: Phase 5 - Product completion

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
