name: EOS Deployment Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-and-smoke:
    name: Immutable v2 image / deployment smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: eos_v2
          POSTGRES_PASSWORD: eos_v2
          POSTGRES_DB: eos_v2_ci
        options: >-
          --health-cmd "pg_isready -U eos_v2 -d eos_v2_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable image tagged with Git SHA
        run: docker build --file Dockerfile.v2 --tag eos-v2:${GITHUB_SHA} .
      - name: Verify non-root runtime user
        run: test "$(docker image inspect eos-v2:${GITHUB_SHA} --format '{{.Config.User}}')" = "eos"
      - name: Run migration before application startup
        env:
          DATABASE_URL: postgresql://eos_v2:eos_v2@127.0.0.1:5432/eos_v2_ci
        run: |
          python -m pip install --quiet psycopg2-binary
          python scripts/migrate_v2.py
      - name: Start immutable application image
        run: |
          docker run --detach --rm --name eos-v2-smoke \
            --network host \
            -e DATABASE_URL=postgresql://eos_v2:eos_v2@127.0.0.1:5432/eos_v2_ci \
            -e ENVIRONMENT=testing \
            -e SECRET_KEY=test_secret_key_for_ci_only_12345678901234567890 \
            eos-v2:${GITHUB_SHA}
      - name: Verify liveness and readiness
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health/live && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '"runtime":"v2"'
      - name: Stop smoke container
        if: always()
        run: docker stop eos-v2-smoke || true
