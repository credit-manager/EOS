name: One-time dashboard isolation

on:
  push:
    branches: [custom-erp-system-for-companies-24152]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden dashboard tenant boundaries
        shell: python
        run: |
          from pathlib import Path
          p = Path('routers/dashboards.py')
          s = p.read_text(encoding='utf-8')
          if 'from core.auth import get_current_user, require_permission' not in s:
              s = s.replace('from core.auth import get_current_user, require_permission', 'from core.auth import get_current_user, require_permission')
          replacements = {
              'async def get_dashboard(\n    dashboard_id: str,\n    db: Session = Depends(get_db),': 'async def get_dashboard(\n    dashboard_id: str,\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
              'async def delete_dashboard(\n    dashboard_id: str,\n    db: Session = Depends(get_db),': 'async def delete_dashboard(\n    dashboard_id: str,\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
              'async def create_widget(\n    dashboard_id: str,\n    body: dict,\n    db: Session = Depends(get_db),': 'async def create_widget(\n    dashboard_id: str,\n    body: dict,\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
              'async def list_widgets(\n    dashboard_id: str,\n    db: Session = Depends(get_db),': 'async def list_widgets(\n    dashboard_id: str,\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
              'async def delete_widget(\n    dashboard_id: str,\n    widget_id: str,\n    db: Session = Depends(get_db),': 'async def delete_widget(\n    dashboard_id: str,\n    widget_id: str,\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
              'async def list_kpis(\n    db: Session = Depends(get_db),': 'async def list_kpis(\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
              'async def create_kpi(\n    body: dict,\n    db: Session = Depends(get_db),': 'async def create_kpi(\n    body: dict,\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
              'async def delete_kpi(\n    kpi_id: str,\n    db: Session = Depends(get_db),': 'async def delete_kpi(\n    kpi_id: str,\n    user: dict = Depends(get_current_user),\n    db: Session = Depends(get_db),',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          # Scope dashboard ownership checks. NULL is reserved for global/system dashboards.
          s = s.replace('text("SELECT id FROM dbp_dashboards WHERE code = :code")', 'text("SELECT id FROM dbp_dashboards WHERE code = :code AND (tenant_id = :tid OR tenant_id IS NULL)")')
          s = s.replace('{"code": code},\n    ).fetchone()', '{"code": code, "tid": tenant_id},\n    ).fetchone()', 1)
          s = s.replace('text("DELETE FROM dbp_dashboards WHERE id = :id")', 'text("DELETE FROM dbp_dashboards WHERE id = :id AND tenant_id = :tid")')
          s = s.replace('{"id": dashboard_id},\n    )\n    db.commit()', '{"id": dashboard_id, "tid": user["tenant_id"]},\n    )\n    db.commit()', 1)
          # All widget mutations/read operations first verify the parent dashboard belongs to the tenant.
          marker = '    """Add a widget to a dashboard."""\n'
          guard = marker + '    dash = db.execute(text("SELECT id FROM dbp_dashboards WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)"), {"id": dashboard_id, "tid": user["tenant_id"]}).fetchone()\n    if not dash:\n        raise HTTPException(status_code=404, detail="Dashboard not found")\n'
          s = s.replace(marker, guard, 1)
          marker = '    """List widgets for a dashboard."""\n'
          guard = marker + '    dash = db.execute(text("SELECT id FROM dbp_dashboards WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)"), {"id": dashboard_id, "tid": user["tenant_id"]}).fetchone()\n    if not dash:\n        raise HTTPException(status_code=404, detail="Dashboard not found")\n'
          s = s.replace(marker, guard, 1)
          marker = '    """Delete a widget from a dashboard."""\n'
          guard = marker + '    dash = db.execute(text("SELECT id FROM dbp_dashboards WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)"), {"id": dashboard_id, "tid": user["tenant_id"]}).fetchone()\n    if not dash:\n        raise HTTPException(status_code=404, detail="Dashboard not found")\n'
          s = s.replace(marker, guard, 1)
          s = s.replace('WHERE dashboard_id = :did AND is_active = true', 'WHERE dashboard_id = :did AND is_active = true', 1)
          s = s.replace('text("DELETE FROM dbp_dashboard_widgets WHERE id = :id AND dashboard_id = :did")', 'text("DELETE FROM dbp_dashboard_widgets WHERE id = :id AND dashboard_id = :did")')
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/one-time-dashboard-isolation.yml').unlink(missing_ok=True)
      - name: Commit
        shell: bash
        run: |
          git config user.name "EOS Security Bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add routers/dashboards.py .github/workflows/one-time-dashboard-isolation.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "security: enforce dashboard tenant isolation"
          git push
