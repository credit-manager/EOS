name: 2TO EOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eos
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eos -d eos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install '.[test]'
      
      - name: Run linter
        run: ruff check backend main.py
      
      - name: Run type checker
        run: ruff check --select=I backend main.py
      
      - name: Validate SQLite migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci.db
      
      - name: Test SQLite
        run: pytest -v
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci_test.db
          REDIS_URL: redis://localhost:6379/0
      
      - name: Validate PostgreSQL migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos
      
      - name: Test PostgreSQL
        run: pytest -v
        env:
          DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos
          REDIS_URL: redis://localhost:6379/0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install pip-audit safety
      
      - name: Run pip-audit
        run: pip-audit
      
      - name: Run safety check
        run: safety check
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run linter
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check
        continue-on-error: true
      
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t eos-api:latest .
      
      - name: Test Docker image
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e DATABASE_URL=sqlite+pysqlite:///:memory: \
            -e JWT_SECRET=test-secret-key-for-ci-only-12345678 \
            -e APP_ENV=development \
            eos-api:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api
