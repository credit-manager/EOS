name: 2TO EOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eos
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eos -d eos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install '.[test]'
      
      - name: Run linter
        run: ruff check backend main.py
      
      - name: Run type checker
        run: ruff check --select=I backend main.py
      
      - name: Validate SQLite migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci.db
      
      - name: Test SQLite
        run: |
          set +e
          pytest -v --tb=long --disable-warnings 2>&1 | tee /tmp/sqlite-test.log
          code=${PIPESTATUS[0]}
          echo "PYTEST_EXIT_CODE=$code"
          {
            echo "=== FIRST 40 LINES ==="
            head -40 /tmp/sqlite-test.log
            echo ""
            echo "=== FAILED / ERROR LINES ==="
            grep -aE "^(FAILED|ERROR|ERRORS|Fatal|ImportError|ModuleNotFoundError|SyntaxError)" /tmp/sqlite-test.log
            echo ""
            echo "=== LAST 120 LINES ==="
            tail -120 /tmp/sqlite-test.log
            echo "PYTEST_EXIT_CODE=$code"
          } > "$GITHUB_STEP_SUMMARY"
          sed 's/%/%25/g; s/\r/%0D/g' /tmp/sqlite-test.log | grep -aE "^(FAILED|ERROR|ERRORS|Fatal|ImportError|ModuleNotFoundError|SyntaxError)|assert|Traceback" | tail -40 > /tmp/sqlite-err.txt
          if [ -s /tmp/sqlite-err.txt ]; then
            while IFS= read -r line; do
              echo "::error file=sqlite-tests.log::$line"
            done < /tmp/sqlite-err.txt
          fi
          exit $code
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci_test.db
          REDIS_URL: redis://localhost:6379/0
      
      - name: Validate PostgreSQL migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos
      
      - name: Test PostgreSQL
        run: |
          set +e
          pytest -v --tb=long --disable-warnings 2>&1 | tee /tmp/pg-test.log
          code=${PIPESTATUS[0]}
          echo "PYTEST_EXIT_CODE=$code"
          {
            echo "=== FIRST 40 LINES ==="
            head -40 /tmp/pg-test.log
            echo ""
            echo "=== FAILED / ERROR LINES ==="
            grep -aE "^(FAILED|ERROR|ERRORS|Fatal|ImportError|ModuleNotFoundError|SyntaxError)" /tmp/pg-test.log
            echo ""
            echo "=== LAST 120 LINES ==="
            tail -120 /tmp/pg-test.log
            echo "PYTEST_EXIT_CODE=$code"
          } > "$GITHUB_STEP_SUMMARY"
          sed 's/%/%25/g; s/\r/%0D/g' /tmp/pg-test.log | grep -aE "^(FAILED|ERROR|ERRORS|Fatal|ImportError|ModuleNotFoundError|SyntaxError)|assert|Traceback" | tail -40 > /tmp/pg-err.txt
          if [ -s /tmp/pg-err.txt ]; then
            while IFS= read -r line; do
              echo "::error file=pg-tests.log::$line"
            done < /tmp/pg-err.txt
          fi
          exit $code
        env:
          DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos
          REDIS_URL: redis://localhost:6379/0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install pip-audit
      
      - name: Run pip-audit
        run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run linter
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check
        continue-on-error: true
      
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t eos-api:latest .
      
      - name: Test Docker image
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e DATABASE_URL=sqlite+pysqlite:///:memory: \
            -e JWT_SECRET=test-secret-key-for-ci-only-12345678 \
            -e APP_ENV=development \
            eos-api:latest
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/api/v1/health >/tmp/health.json 2>&1; then
              ok=1
              echo "HEALTH_OK: $(cat /tmp/health.json)"
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            {
              echo "=== CURL VERBOSE ==="
              curl -v --max-time 5 http://localhost:8000/api/v1/health 2>&1 | tail -25
              echo ""
              echo "=== DOCKER LOGS (test-api) ==="
              docker logs --tail 100 test-api 2>&1
              echo ""
              echo "=== DOCKER PS ==="
              docker ps -a
            } > /tmp/dkr-diag.txt 2>&1 || true
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/dkr-diag.txt | head -c 30000 | paste -sd ' ')
            echo "::error file=docker-test.log::$msg"
            exit 1
          fi
          docker stop test-api
