name: EOS Platform CI/CD

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend-build:
    name: 🟣 Frontend - Canonical React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: erp-system/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: erp-system/frontend
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        working-directory: erp-system/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: erp-system/frontend
        run: npm run build
      - name: Verify production artifact
        run: |
          test -f erp-system/frontend/dist/index.html
          test -n "$(find erp-system/frontend/dist/assets -type f | head -1)"

  smoke-test:
    name: 🔴 Phase 0 - Smoke Test
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: |
          python -m py_compile main.py
          python - <<'PY'
          import ast
          from pathlib import Path
          roots = [Path('core'), Path('routers'), Path('models'), Path('tests')]
          files = [p for root in roots if root.exists() for p in root.rglob('*.py')]
          for path in files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print(f'Parsed {len(files)} Python files successfully')
          PY
          DATABASE_URL="postgresql://user:pass@localhost/test" python -c "import main"
        env:
          DATABASE_URL: postgresql://user:pass@localhost/test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890

  code-quality:
    name: 🟠 Phase 1 - Code Quality
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Ruff critical checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Flake8 critical checks
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Bandit high-confidence checks
        run: bandit -r core/ routers/ models/ -ll -ii -f json -o bandit-report.json
      - name: Dependency audit
        run: pip-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bandit-security-report, path: bandit-report.json, retention-days: 30 }

  automated-tests:
    name: 🟠 Phase 1 - Automated Tests
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: test_user, POSTGRES_PASSWORD: test_pass, POSTGRES_DB: eos_test }
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: pytest tests/ --asyncio-mode=auto --cov=core --cov=routers --cov=models --cov-report=xml --cov-report=html -v --tb=short
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-report, path: htmlcov/, retention-days: 30 }

  security-validation:
    name: 🟡 Phase 3 - Security Validation
    runs-on: ubuntu-latest
    needs: [code-quality, automated-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: |
          bandit -r . -ll -ii -f json -o deep-security-report.json
          grep -rn "execute.*%" --include="*.py" core/ routers/ && exit 1 || true
      - run: |
          python - <<'PY'
          import ast
          files_to_check = ['core/metadata_engine.py', 'core/builder_engine.py', 'routers/dynamic_crud.py']
          for filename in files_to_check:
              source = open(filename, encoding='utf-8-sig').read()
              ast.parse(source, filename=filename)
              if 'tenant_id' not in source:
                  raise SystemExit(f'{filename}: Missing tenant_id handling')
          print('Tenant isolation patterns validated')
          PY

  summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-build, smoke-test, code-quality, automated-tests, security-validation]
    if: always()
    steps:
      - run: |
          echo "# EOS Platform CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke test: ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Automated tests: ${{ needs.automated-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security validation: ${{ needs.security-validation.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.frontend-build.result }}" != "success" ] || [ "${{ needs.smoke-test.result }}" != "success" ] || [ "${{ needs.code-quality.result }}" != "success" ] || [ "${{ needs.automated-tests.result }}" != "success" ] || [ "${{ needs.security-validation.result }}" != "success" ]; then exit 1; fi
