name: EOS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.14'
  PGVERSION: '18'

jobs:
  # ──────────────────────────────────────────────────────────
  # LINT & TYPE CHECK
  # ──────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy ruff

      - name: Ruff lint
        run: ruff check . --output-format=github || true

      - name: Mypy type check
        run: mypy database.py core/ routers/auth.py --ignore-missing-imports --no-error-summary || true

  # ──────────────────────────────────────────────────────────
  # TESTS
  # ──────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: eos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://eos:testpass@localhost:5432/eos_test
      EOS_AUTH_MODE: test
      EOS_SECRET_KEY: ci-test-secret-key-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m pytest tests/test_regression_security_fixes.py -v --tb=short

      - name: Run all tests (if DB available)
        run: |
          python -m pytest tests/ -v --tb=short || true
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # SECURITY SCAN
  # ──────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt || true
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # BUILD CHECK
  # ──────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify imports
        run: |
          python -c "from main import app; print('App imports OK')"

      - name: Verify migrations
        run: |
          python -c "from alembic.config import Config; Config('alembic.ini')" || true
