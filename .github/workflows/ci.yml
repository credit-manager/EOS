name: 2TO EOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: ruff check backend main.py
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci.db
      - run: pytest
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci_test.db

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
