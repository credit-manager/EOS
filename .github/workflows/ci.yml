name: EOS Platform CI/CD

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend - Canonical React Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: erp-system/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: erp-system/frontend
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        working-directory: erp-system/frontend
        run: npm run lint
      - name: Run frontend functional tests
        working-directory: erp-system/frontend
        run: npm run test -- --run
      - name: Build frontend
        working-directory: erp-system/frontend
        run: npm run build
      - name: Verify production artifact
        run: |
          test -f erp-system/frontend/dist/index.html
          test -n "$(find erp-system/frontend/dist/assets -type f | head -1)"

  smoke-test:
    name: Phase 0 - Smoke Test
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: |
          python -m py_compile main.py
          python - <<'PY'
          import ast
          from pathlib import Path
          roots = [Path('core'), Path('routers'), Path('models'), Path('tests')]
          files = [p for root in roots if root.exists() for p in root.rglob('*.py')]
          for path in files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print(f'Parsed {len(files)} Python files successfully')
          PY
        env:
          DATABASE_URL: postgresql://user:pass@localhost/test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890

  migration-validation:
    name: Phase 0 - PostgreSQL Migration Validation
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: migration_pass
          POSTGRES_DB: eos_migration
        options: >-
          --health-cmd "pg_isready -U migration_user -d eos_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Upgrade database to Alembic head
        env:
          DATABASE_URL: postgresql://migration_user:migration_pass@127.0.0.1:5432/eos_migration
          PGPASSWORD: migration_pass
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
          EXPECTED_ALEMBIC_HEAD: 20260906_accounting_integrity
        run: |
          alembic upgrade head
          test "$(alembic heads | grep -c "^${EXPECTED_ALEMBIC_HEAD}")" -eq 1
          test "$(psql -h 127.0.0.1 -U migration_user -d eos_migration -Atc "SELECT version_num FROM alembic_version")" = "${EXPECTED_ALEMBIC_HEAD}"
      - name: Verify canonical initial-schema table coverage
        env:
          DATABASE_URL: postgresql://migration_user:migration_pass@127.0.0.1:5432/eos_migration
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import psycopg2

          migration = Path('alembic/versions/87aba7990b4d_initial_schema.py')
          tree = ast.parse(migration.read_text(encoding='utf-8-sig'), filename=str(migration))
          expected = set()
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              func = node.func
              if isinstance(func, ast.Attribute) and isinstance(func.value, ast.Name) and func.value.id == 'op' and func.attr == 'create_table':
                  if node.args and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str):
                      expected.add(node.args[0].value)

          conn = psycopg2.connect('postgresql://migration_user:migration_pass@127.0.0.1:5432/eos_migration')
          with conn.cursor() as cur:
              cur.execute("SELECT tablename FROM pg_catalog.pg_tables WHERE schemaname='public'")
              actual = {row[0] for row in cur.fetchall()}
          conn.close()

          missing = sorted(expected - actual)
          print(f'Canonical CREATE TABLE declarations: {len(expected)}')
          print(f'Public tables after upgrade head: {len(actual)}')
          print(f'Missing canonical tables: {len(missing)}')
          if missing:
              print('\n'.join(missing[:200]))
              raise SystemExit('Canonical schema is incomplete on a fresh database')
          PY

  live-tenant-isolation:
    name: Phase 2 - Live PostgreSQL Tenant Isolation E2E
    runs-on: ubuntu-latest
    needs: migration-validation
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: eos_rls_e2e
        options: >-
          --health-cmd "pg_isready -U test_user -d eos_rls_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run mandatory live RLS CRUD isolation test
        env:
          EOS_TEST_DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/eos_rls_e2e
          DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/eos_rls_e2e
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_live_postgres_e2e.py -v --tb=short

  api-tenant-isolation:
    name: Phase 2 - FastAPI Cross-Tenant API E2E
    runs-on: ubuntu-latest
    needs: migration-validation
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: eos_api_e2e
        options: >-
          --health-cmd "pg_isready -U test_user -d eos_api_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply canonical schema
        env:
          DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/eos_api_e2e
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
        run: alembic upgrade head
      - name: Run FastAPI cross-tenant E2E
        env:
          DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/eos_api_e2e
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
          EOS_EMAIL_PROVIDER: console
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_api_tenant_isolation.py -v --tb=short

  code-quality:
    name: Phase 1 - Code Quality
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: ruff check . --select E9,F63,F7,F82
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: bandit -r core/ routers/ models/ -ll -ii -f json -o bandit-report.json
      - run: pip-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  automated-tests:
    name: Phase 1 - Automated Tests
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: eos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run test suite
        env:
          DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/eos_test
          EOS_TEST_DATABASE_URL: postgresql://test_user:test_pass@127.0.0.1:5432/eos_test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
          EOS_EMAIL_PROVIDER: console
          REDIS_URL: redis://127.0.0.1:6379/0
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q --capture=sys
