name: EOS Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-build:
    name: 🟣 Frontend - Canonical React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-system/frontend/package.json
      - name: Install frontend dependencies
        working-directory: erp-system/frontend
        run: npm install --no-audit --no-fund
      - name: Lint frontend
        working-directory: erp-system/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: erp-system/frontend
        run: npm run build
      - name: Verify production artifact
        run: |
          test -f erp-system/frontend/dist/index.html
          test -n "$(find erp-system/frontend/dist/assets -type f | head -1)"
          echo "✅ Canonical frontend build artifact verified"

  smoke-test:
    name: 🔴 Phase 0 - Smoke Test
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Python syntax
        run: |
          python -m py_compile main.py
          python -m py_compile $(find core routers models tests -name "*.py" 2>/dev/null || true)
      - name: Test imports
        run: |
          DATABASE_URL="postgresql://user:pass@localhost/test" python -c "import main"
          echo "✅ All imports successful"
        env:
          DATABASE_URL: postgresql://user:pass@localhost/test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890

  code-quality:
    name: 🟠 Phase 1 - Code Quality
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff linter
        run: ruff check . || echo "⚠️ Linting issues found (non-blocking)"
      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      - name: Security scan with Bandit
        run: bandit -r core/ routers/ models/ -f json -o bandit-report.json || echo "⚠️ Security issues found"
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
      - name: Check for vulnerable dependencies
        run: pip-audit || echo "⚠️ Vulnerable dependencies found"

  automated-tests:
    name: 🟠 Phase 1 - Automated Tests
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: eos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest with coverage
        run: |
          pytest tests/ --asyncio-mode=auto --cov=core --cov=routers --cov=models \
            --cov-report=xml --cov-report=html -v --tb=short
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  security-validation:
    name: 🟡 Phase 3 - Security Validation
    runs-on: ubuntu-latest
    needs: [code-quality, automated-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: pip install bandit pip-audit safety
      - name: Deep security scan
        run: |
          bandit -r . -ll -ii -f json -o deep-security-report.json || true
          grep -rn "execute.*%" --include="*.py" core/ routers/ || echo "✅ No obvious SQL injection patterns"
          grep -rn "password\s*=\s*['\"]" --include="*.py" core/ routers/ models/ || echo "✅ No hardcoded passwords"
          grep -rn "DEBUG\s*=\s*True" --include="*.py" core/ | grep -v test || echo "✅ Debug mode not enabled in core"
      - name: Validate tenant isolation patterns
        run: |
          python - <<'PY'
          import ast
          files_to_check = ['core/metadata_engine.py', 'core/builder_engine.py', 'routers/dynamic_crud.py']
          issues = []
          for filename in files_to_check:
              try:
                  source = open(filename, encoding='utf-8').read()
                  ast.parse(source)
                  if 'tenant_id' not in source:
                      issues.append(f'{filename}: Missing tenant_id handling')
              except FileNotFoundError:
                  pass
          if issues:
              raise SystemExit('\n'.join(issues))
          print('✅ Tenant isolation patterns validated')
          PY

  summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-build, smoke-test, code-quality, automated-tests, security-validation]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# EOS Platform CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke test: ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Automated tests: ${{ needs.automated-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security validation: ${{ needs.security-validation.result }}" >> $GITHUB_STEP_SUMMARY
