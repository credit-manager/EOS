name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/

      - name: Check formatting
        run: ruff format --check backend/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v --tb=short -q
        env:
          DATABASE_URL: "sqlite+pysqlite:///./test.db"
          JWT_SECRET: "test-secret-key-for-ci-only-not-production"
          REDIS_URL: "redis://localhost:6379/0"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t eos-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t eos-frontend:ci .

      - name: Verify images
        run: |
          docker run --rm eos-backend:ci python -c "import fastapi; print('Backend OK')"
          docker run --rm eos-frontend:ci nginx -t

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: ESLint check
        working-directory: frontend
        run: npx eslint src --max-warnings 0
