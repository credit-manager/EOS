name: 2TO EOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eos
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eos -d eos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: ruff check backend main.py
      - name: Validate SQLite migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci.db
      - name: Test SQLite
        run: alembic upgrade head && pytest
        env:
          DATABASE_URL: sqlite+pysqlite:///./eos_ci_test.db
      - name: Validate PostgreSQL migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos
      - name: Test PostgreSQL
        run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build
