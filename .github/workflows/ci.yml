name: EOS Platform CI/CD
on:
  push: {branches: [main, develop]}
  pull_request: {branches: [main, develop]}
permissions: {contents: read, security-events: write}
jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q core routers models.py main.py
      - name: Verify application import
        env: {DATABASE_URL: sqlite:///./ci_smoke.db, SECRET_KEY: ci_smoke_secret_key_12345678901234567890, EOS_TEST_SECRET_KEY: ci_smoke_secret_key_12345678901234567890, EOS_AUTH_MODE: testing}
        run: python -c "import main; print('EOS import OK')"
      - if: always()
        run: rm -f ci_smoke.db
  frontend-build:
    name: Canonical Frontend Quality and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '22', package-manager-cache: false}
      - name: Generate lockfile for legacy lockfile-less checkout
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean deterministic install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build canonical frontend
        working-directory: frontend
        run: npm run build
      - run: test -f frontend/dist/index.html
  code-quality:
    name: Code Quality and Dependency Security
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install ruff flake8 bandit pip-audit pbr
      - run: ruff check . --select E9,F63,F7,F82 --exclude 'eos-system/frontend/dist/**' --exclude 'frontend/**'
      - run: flake8 . --count --select=E9,F63,F7,F82 --exclude=.git,eos-system/frontend/dist,frontend --show-source --statistics
      - run: bandit -r core/ routers/ models/ -ll -ii
      - run: pip-audit --ignore-vuln PYSEC-2026-1325
  automated-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_USER: test_user, POSTGRES_PASSWORD: test_pass, POSTGRES_DB: eos_test}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest pytest-cov
      - name: Run tests with coverage
        env: {DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_test, SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890, EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890, ENVIRONMENT: testing, EOS_AUTH_MODE: testing}
        run: pytest tests/ --asyncio-mode=auto --cov=core --cov=routers --cov=models --cov-report=term-missing --cov-report=xml --cov-report=html -v --tb=short
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: coverage-report, path: htmlcov/, retention-days: 30}
  migration-validation:
    name: Database Migration Validation
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_USER: test_user, POSTGRES_PASSWORD: test_pass, POSTGRES_DB: eos_migration}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Upgrade to Alembic head
        env: {DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_migration, SECRET_KEY: migration_secret_key_for_ci_only_12345678901234567890, EOS_AUTH_MODE: testing}
        run: alembic upgrade head
      - name: Assert exactly one Alembic head
        env: {DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_migration, SECRET_KEY: migration_secret_key_for_ci_only_12345678901234567890, EOS_AUTH_MODE: testing}
        run: test "$(alembic heads | grep -c '^20260904_financial_controls')" -eq 1
      - name: Detect model/migration drift
        env: {DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_migration, SECRET_KEY: migration_secret_key_for_ci_only_12345678901234567890, EOS_AUTH_MODE: testing}
        run: alembic check
  security-validation:
    name: Security Regression Suite
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: pytest -q tests -k 'tenant or security or reliability or health'
  summary:
    name: CI Gate Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [smoke-test, frontend-build, code-quality, automated-tests, migration-validation, security-validation]
    steps:
      - name: Require all gates to pass
        env:
          SMOKE: ${{ needs.smoke-test.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
          QUALITY: ${{ needs.code-quality.result }}
          TESTS: ${{ needs.automated-tests.result }}
          MIGRATIONS: ${{ needs.migration-validation.result }}
          SECURITY: ${{ needs.security-validation.result }}
        run: |
          test "$SMOKE" = success
          test "$FRONTEND" = success
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$MIGRATIONS" = success
          test "$SECURITY" = success
