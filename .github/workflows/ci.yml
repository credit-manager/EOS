name: EOS Platform CI/CD
on:
  push: {branches: [main, develop]}
  pull_request: {branches: [main, develop]}
permissions: {contents: read, security-events: write}
jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q core routers models.py main.py
      - name: Verify application import
        env: {DATABASE_URL: sqlite:///./ci_smoke.db, SECRET_KEY: ci_smoke_secret_key_12345678901234567890, EOS_TEST_SECRET_KEY: ci_smoke_secret_key_12345678901234567890, EOS_AUTH_MODE: testing}
        run: python -c "import main; print('EOS import OK')"
      - if: always()
        run: rm -f ci_smoke.db
  frontend-build:
    name: Canonical Frontend Quality and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package.json}
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build canonical frontend
        working-directory: frontend
        run: npm run build
      - run: test -f frontend/dist/index.html
  code-quality:
    name: Code Quality and Dependency Security
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install ruff flake8 bandit pip-audit pbr
      - run: ruff check . --select E9,F63,F7,F82 --exclude 'eos-system/frontend/dist/**' --exclude 'frontend/**'
      - run: flake8 . --count --select=E9,F63,F7,F82 --exclude=.git,eos-system/frontend/dist,frontend --show-source --statistics
      - run: bandit -r core/ routers/ models/ -ll -ii
      - run: pip-audit --ignore-vuln PYSEC-2026-1325
  automated-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_USER: test_user, POSTGRES_PASSWORD: test_pass, POSTGRES_DB: eos_test}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest pytest-cov
      - name: Run tests with coverage
        env: {DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_test, SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890, EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890, ENVIRONMENT: testing, EOS_AUTH_MODE: testing}
        run: pytest tests/ --asyncio-mode=auto --cov=core --cov=routers --cov=models --cov-report=term-missing --cov-report=xml --cov-report=html -v --tb=short
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: coverage-report, path: htmlcov/, retention-days: 30}
  migration-validation:
    name: Database Migration Validation
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_USER: migration_user, POSTGRES_PASSWORD: migration_pass, POSTGRES_DB: eos_migration}
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5433:5432']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with: {python-version: '3.12', cache: 'pip'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate migration graph and clean upgrade
        env: {DATABASE_URL: postgresql://migration_user:migration_pass@localhost:5433/eos_migration}
        run: test "$(alembic heads | grep -c '(head)')" -eq 1 && alembic upgrade head && test "$(alembic current | grep -c '20260904_financial_controls')" -eq 1 && alembic check
  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    needs: [code-quality, automated-tests, migration-validation]
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_USER: security_user, POSTGRES_PASSWORD: security_pass, POSTGRES_DB: eos_security}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5434:5432']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: bandit -r . -ll -ii -x ./tests,./.git,./eos-system/frontend/dist,./frontend
      - run: pip-audit --ignore-vuln PYSEC-2026-1325
      - name: Reject obvious debug artifacts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'DEBUG[[:space:]]*=[[:space:]]*True' --include='*.py' core routers models.py; then exit 1; fi
          if grep -RInE 'print\([^)]*(SECRET|TOKEN|PASSWORD|AUTH|API[_-]?KEY)' --include='*.py' core routers models.py; then exit 1; fi
      - name: Run tenant/security/reliability regression suite
        env: {DATABASE_URL: postgresql://security_user:security_pass@localhost:5434/eos_security, SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890, EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890, EOS_AUTH_MODE: testing}
        run: pytest -q tests -k 'tenant or security or reliability or health'
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [smoke-test, frontend-build, code-quality, automated-tests, migration-validation, security-validation]
    if: always()
    steps:
      - name: Enforce all required jobs passed
        shell: bash
        run: |
          set -euo pipefail
          results='${{ needs.smoke-test.result }} ${{ needs.frontend-build.result }} ${{ needs.code-quality.result }} ${{ needs.automated-tests.result }} ${{ needs.migration-validation.result }} ${{ needs.security-validation.result }}'
          echo "Results: $results"
          test "$results" = 'success success success success success success'
          echo '# EOS CI: all blocking gates passed' >> "$GITHUB_STEP_SUMMARY"
