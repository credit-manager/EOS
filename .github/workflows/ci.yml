name: EOS Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff flake8 bandit pip-audit
      - name: Verify Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q core routers models tests main.py
      - name: Test critical imports
        env:
          DATABASE_URL: postgresql://user:pass@localhost/test
          EOS_AUTH_MODE: testing
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
        run: python -c "import main"

  code-quality:
    name: Code Quality and Dependency Security
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff flake8 bandit pip-audit
      - name: Ruff
        run: ruff check .
      - name: Flake8 critical errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Bandit
        run: bandit -r core/ routers/ models/ -ll -ii
      - name: Dependency audit
        run: pip-audit

  automated-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: eos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/eos_test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
          EOS_AUTH_MODE: testing
        run: |
          pytest tests/ --asyncio-mode=auto --cov=core --cov=routers --cov=models \
            --cov-report=term-missing --cov-report=xml --cov-report=html -v --tb=short
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  migration-validation:
    name: Database Migration Validation
    runs-on: ubuntu-latest
    needs: smoke-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: migration_pass
          POSTGRES_DB: eos_migration
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic
      - name: Validate migration graph
        env:
          DATABASE_URL: postgresql://migration_user:migration_pass@localhost:5433/eos_migration
        run: |
          set -euo pipefail
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic history
          alembic upgrade head
          alembic current
          alembic check

  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    needs: [code-quality, automated-tests, migration-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit pytest
      - name: Deep Bandit scan
        run: bandit -r . -ll -ii -x ./tests,./.git
      - name: Dependency audit
        run: pip-audit
      - name: Reject obvious debug artifacts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'DEBUG[[:space:]]*=[[:space:]]*True' --include='*.py' core routers models; then
            echo 'Debug mode assignment found in production code'
            exit 1
          fi
          if grep -RInE 'print\([^)]*(SECRET|TOKEN|PASSWORD|AUTH|API[_-]?KEY)' --include='*.py' core routers models; then
            echo 'Potential secret-bearing print statement found'
            exit 1
          fi
      - name: Run tenant/security regression suite
        env:
          DATABASE_URL: postgresql://user:pass@localhost/test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_AUTH_MODE: testing
        run: |
          set -euo pipefail
          if find tests -type f \( -iname '*tenant*' -o -iname '*security*' \) | grep -q .; then
            pytest -q tests -k 'tenant or security'
          else
            echo 'No dedicated tenant/security test files found; failing until the suite is added.'
            exit 1
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [smoke-test, code-quality, automated-tests, migration-validation, security-validation]
    if: always()
    steps:
      - name: Enforce all required jobs passed
        shell: bash
        run: |
          set -euo pipefail
          results='${{ needs.smoke-test.result }} ${{ needs.code-quality.result }} ${{ needs.automated-tests.result }} ${{ needs.migration-validation.result }} ${{ needs.security-validation.result }}'
          echo "Results: $results"
          test "$results" = 'success success success success success'
          echo '# EOS CI: all blocking gates passed' >> "$GITHUB_STEP_SUMMARY"
