# Security regression suite. Dependency installation intentionally follows requirements.txt.
name: EOS Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile security-sensitive modules
        run: |
          python -m py_compile \
            security/tenant_scope.py \
            routers/industry_framework.py \
            routers/entity_management.py \
            routers/ai_composer.py \
            routers/builder.py \
            routers/dynamic_crud.py \
            core/security.py \
            core/production_auth.py \
            core/control_plane_security.py
      - name: Tenant isolation and ERP generation tests
        run: PYTHONPATH=. pytest -q tests/test_tenant_scope.py tests/test_e2e_erp_generation.py
      - name: Composer and Builder integration contracts
        run: PYTHONPATH=. pytest -q tests/test_composer_builder_e2e.py
      - name: Dynamic CRUD mandatory security regressions
        run: PYTHONPATH=. pytest -q tests/test_dynamic_crud_tenant_security.py
      - name: Commercial security regressions
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/eos_test
          EOS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/eos_test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
          PYTHONPATH: .
        run: PYTHONPATH=. pytest -q tests/test_security_regressions.py tests/test_database_rls_regressions.py tests/test_control_plane_security.py
      - name: Live PostgreSQL tenant isolation smoke test
        env:
          EOS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/eos_test
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/eos_test
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
          PYTHONPATH: .
        run: |
          alembic upgrade head
          PYTHONPATH=. pytest -q tests/test_live_postgres_e2e.py
