name: One-time analytics repair

on:
  push:
    branches: [custom-erp-system-for-companies-24152]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair undefined uuid and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('core/analytics_engine.py')
          s = p.read_text(encoding='utf-8-sig')
          if '\nimport uuid\n' not in s:
              s = s.replace('\nimport logging\n', '\nimport logging\nimport uuid\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/repair-analytics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/analytics_engine.py .github/workflows/repair-analytics.yml
          git diff --cached --quiet || git commit -m 'Fix undefined uuid in analytics engine [skip ci]'
          git push
