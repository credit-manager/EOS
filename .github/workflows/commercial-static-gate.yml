name: EOS Commercial Static Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'commercial-readiness-hardening-*']

permissions:
  contents: read

concurrency:
  group: eos-commercial-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    name: Runtime / financial / migration anti-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Execute commercial static gate
        run: python scripts/commercial_static_gate.py
      - name: Verify Alembic revision graph
        run: python scripts/check_alembic_graph.py
      - name: Compile all Python modules
        run: python -m compileall -q core routers scripts
