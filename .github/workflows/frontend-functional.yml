name: EOS Frontend Functional Certification

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend-functional-certification:
    name: Phase 6 - Frontend Functional Certification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-system/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: erp-system/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend contract tests
        run: npm run test:run

      - name: Build production frontend
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -type f | head -1)"

      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Chromium for browser certification
        run: npx playwright install --with-deps chromium

      - name: Run browser functional certification
        run: npx playwright test
