name: Final Hardening Pass
on:
  push:
    branches: [custom-erp-system-for-companies-24152]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-erp-system-for-companies-24152
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply security hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('routers/dashboards.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('SELECT id FROM dbp_dashboards WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)', 'SELECT id FROM dbp_dashboards WHERE id = :id AND tenant_id = :tid', 1)
          s = s.replace('SELECT id FROM dbp_dashboards WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)', 'SELECT id FROM dbp_dashboards WHERE id = :id AND tenant_id = :tid', 1)
          s = s.replace('SELECT id FROM dbp_dashboards WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)', 'SELECT id FROM dbp_dashboards WHERE id = :id AND tenant_id = :tid', 1)
          s = s.replace('"WHERE dashboard_id = :did AND is_active = true "', '"WHERE dashboard_id = :did AND is_active = true "')
          s = s.replace('"FROM dbp_kpis ORDER BY code"', '"FROM dbp_kpis WHERE tenant_id = :tid ORDER BY code"')
          s = s.replace('"FROM dbp_kpis WHERE tenant_id = :tid ORDER BY code"\n        ),\n    ).fetchall()', '"FROM dbp_kpis WHERE tenant_id = :tid ORDER BY code"\n        ),\n        {"tid": user["tenant_id"]},\n    ).fetchall()')
          s = s.replace('"VALUES (:id, NULL, :code, :name_en, :name_ar, :ec, "', '"VALUES (:id, :tid, :code, :name_en, :name_ar, :ec, "')
          s = s.replace('"id": kpi_id,\n            "code": code,', '"id": kpi_id,\n            "tid": user["tenant_id"],\n            "code": code,')
          s = s.replace('text("DELETE FROM dbp_kpis WHERE id = :id"),\n        {"id": kpi_id},', 'text("DELETE FROM dbp_kpis WHERE id = :id AND tenant_id = :tid"),\n        {"id": kpi_id, "tid": user["tenant_id"]},')
          p.write_text(s, encoding='utf-8')

          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace(" --exclude 'core/analytics_engine.py' --exclude 'core/audit.py'", "")
          s = s.replace(",core/analytics_engine.py,core/audit.py", "")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile routers/dashboards.py core/analytics_engine.py core/audit.py
      - name: Commit changes
        run: |
          git config user.name 'EOS Security Bot'
          git config user.email 'security-bot@users.noreply.github.com'
          git add routers/dashboards.py .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'fix(security): close dashboard tenant mutation gaps and lint exclusions' || true
          git push origin custom-erp-system-for-companies-24152
