name: One-time analytics lint fix

on:
  push:
    branches: [custom-erp-system-for-companies-24152]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix analytics imports
        shell: python
        run: |
          from pathlib import Path
          p = Path('core/analytics_engine.py')
          text = p.read_text(encoding='utf-8')
          old = 'from datetime import date, datetime, timedelta'
          new = 'from datetime import date, datetime, timedelta, timezone'
          if old in text and new not in text:
              text = text.replace(old, new, 1)
          if 'import uuid\n' not in text:
              marker = 'import logging\n'
              text = text.replace(marker, marker + 'import uuid\n', 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-time-analytics-lint-fix.yml').unlink(missing_ok=True)
      - name: Commit
        shell: bash
        run: |
          git config user.name "EOS Security Bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add core/analytics_engine.py .github/workflows/one-time-analytics-lint-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: resolve analytics engine undefined imports"
          git push
