name: One-time dashboard tenant hardening
on:
  push:
    branches:
      - custom-erp-system-for-companies-24152
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-erp-system-for-companies-24152
      - name: Apply tenant-scoped dashboard access
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('routers/dashboards.py')
          s=p.read_text()
          replacements={
          '    engine = AnalyticsEngine(db)\n    result = engine.execute_dashboard(dashboard_id)': '''    tenant_id = user.get("tenant_id")\n    dash = db.execute(\n        text("SELECT id FROM dbp_dashboards WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)"),\n        {"id": dashboard_id, "tid": tenant_id},\n    ).fetchone()\n    if not dash:\n        raise HTTPException(status_code=404, detail={"status": "error", "error": {"code": "NOT_FOUND", "message": "Dashboard not found"}})\n\n    engine = AnalyticsEngine(db)\n    result = engine.execute_dashboard(dashboard_id, tenant_id=tenant_id)''',
          '    # Validate dashboard exists\n    dash = db.execute(\n        text("SELECT id FROM dbp_dashboards WHERE id = :id"),\n        {"id": dashboard_id},\n    ).fetchone()\n    if not dash:\n        raise HTTPException(status_code=404, detail={\n            "status": "error",\n            "error": {"code": "NOT_FOUND", "message": "Dashboard not found"},\n        })\n\n': '',
          '    result = db.execute(\n        text("DELETE FROM dbp_dashboard_widgets WHERE id = :id AND dashboard_id = :did"),\n        {"id": widget_id, "did": dashboard_id},\n    )': '''    result = db.execute(\n        text("""DELETE FROM dbp_dashboard_widgets w USING dbp_dashboards d\n                  WHERE w.id = :id AND w.dashboard_id = :did\n                    AND d.id = w.dashboard_id\n                    AND (d.tenant_id = :tid OR d.tenant_id IS NULL)"""),\n        {"id": widget_id, "did": dashboard_id, "tid": user["tenant_id"]},\n    )''',
          }
          for a,b in replacements.items():
              if a not in s:
                  raise SystemExit(f'missing expected pattern: {a[:100]}')
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
          python -m py_compile routers/dashboards.py
      - name: Add focused regression tests
        run: |
          cat > tests/test_dashboard_tenant_isolation.py <<'PY'
          from unittest.mock import MagicMock
          import pytest
          from routers.dashboards import get_dashboard, delete_dashboard, list_widgets, delete_widget
          
          @pytest.mark.asyncio
          async def test_get_dashboard_rejects_foreign_tenant():
              db=MagicMock(); db.execute.return_value.fetchone.return_value=None
              with pytest.raises(Exception) as exc:
                  await get_dashboard('dash-b', {'tenant_id':'tenant-a'}, db)
              assert getattr(exc.value, 'status_code', None) == 404
          
          @pytest.mark.asyncio
          async def test_delete_dashboard_is_tenant_scoped():
              db=MagicMock(); db.execute.return_value.rowcount=0
              with pytest.raises(Exception) as exc:
                  await delete_dashboard('dash-b', {'tenant_id':'tenant-a'}, db)
              assert getattr(exc.value, 'status_code', None) == 404
          
          @pytest.mark.asyncio
          async def test_list_widgets_rejects_foreign_dashboard():
              db=MagicMock(); db.execute.return_value.fetchone.return_value=None
              with pytest.raises(Exception) as exc:
                  await list_widgets('dash-b', {'tenant_id':'tenant-a'}, db)
              assert getattr(exc.value, 'status_code', None) == 404
          
          @pytest.mark.asyncio
          async def test_delete_widget_requires_tenant_owned_dashboard():
              db=MagicMock(); db.execute.return_value.fetchone.return_value=None
              with pytest.raises(Exception) as exc:
                  await delete_widget('dash-b','widget-b', {'tenant_id':'tenant-a'}, db)
              assert getattr(exc.value, 'status_code', None) == 404
          PY
          pytest -q tests/test_dashboard_tenant_isolation.py
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/harden_dashboards_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routers/dashboards.py tests/test_dashboard_tenant_isolation.py .github/workflows/harden_dashboards_once.yml
          git commit -m 'security: close dashboard tenant isolation gaps'
          git push origin custom-erp-system-for-companies-24152