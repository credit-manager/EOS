name: Temporary M2M Tenant Isolation Repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-erp-system-for-companies-24152
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch M2M tenant isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/relationship_engine.py')
          s = p.read_text(encoding='utf-8')

          old = '''        if rel_data["relationship_type"] == "many_to_many":
            junction = rel_data.get("junction_table", "")
            j_src = rel_data.get("junction_source_col", "")
            j_tgt = rel_data.get("junction_target_col", "")
            if not junction or not j_src or not j_tgt:
                return []
            query = text(
                f"SELECT t.* FROM {target_table} t "
                f"INNER JOIN {junction} j "
                f"ON j.{j_tgt} = t.{rel_data['target_column']} "
                f"WHERE j.{j_src} = :source_value "
                f"LIMIT 100"
            )
            rows = self.db.execute(query, params).fetchall()
'''
          new = '''        if rel_data["relationship_type"] == "many_to_many":
            junction = rel_data.get("junction_table", "")
            j_src = rel_data.get("junction_source_col", "")
            j_tgt = rel_data.get("junction_target_col", "")
            if not junction or not j_src or not j_tgt:
                return []

            # A many-to-many edge crosses an association table, so tenant
            # filtering must be applied to the target and, when available,
            # the junction table. The source record was already tenant-bound
            # by fetch_nested/fetch_related. Never rely on the junction key
            # alone: UUIDs/IDs can be referenced by rows from another tenant.
            junction_has_tenant = self._has_tenant_column(junction)
            m2m_where = [f"j.{j_src} = :source_value"]
            m2m_params = {"source_value": source_value}
            if rel_data["tenant_scope"] and tenant_id:
                m2m_where.append("t.tenant_id = :tenant_id")
                m2m_params["tenant_id"] = tenant_id
                if junction_has_tenant:
                    m2m_where.append("j.tenant_id = :tenant_id")
            query = text(
                f"SELECT t.* FROM {target_table} t "
                f"INNER JOIN {junction} j "
                f"ON j.{j_tgt} = t.{rel_data['target_column']} "
                f"WHERE {' AND '.join(m2m_where)} "
                f"LIMIT 100"
            )
            rows = self.db.execute(query, m2m_params).fetchall()
'''
          if old not in s:
              raise SystemExit('expected M2M block not found')
          s = s.replace(old, new, 1)

          old_select = '''                    "relationship_type, source_column, target_column, "
                    "lookup_field, tenant_scope "
                    "FROM dbp_relationships WHERE entity_id = :eid"
'''
          new_select = '''                    "relationship_type, source_column, target_column, "
                    "lookup_field, tenant_scope, junction_table, "
                    "junction_source_col, junction_target_col "
                    "FROM dbp_relationships WHERE entity_id = :eid"
'''
          if old_select not in s:
              raise SystemExit('relationship metadata select not found')
          s = s.replace(old_select, new_select, 1)

          # Harden direct fetch_related with the same M2M semantics.
          marker = '''        elif rel.relationship_type == "many_to_one":
'''
          m2m = '''        elif rel.relationship_type == "many_to_many":
            junction = rel.junction_table or ""
            j_src = rel.junction_source_col or ""
            j_tgt = rel.junction_target_col or ""
            if not junction or not j_src or not j_tgt:
                return []
            source_table = source_entity.table_mapping
            source_query = text(
                f"SELECT {rel.source_column} FROM {source_table} "
                f"WHERE id = :record_id"
            )
            source_params = {"record_id": str(source_record_id)}
            if rel.tenant_scope and tenant_id:
                source_query = text(
                    f"SELECT {rel.source_column} FROM {source_table} "
                    f"WHERE id = :record_id AND tenant_id = :tenant_id"
                )
                source_params["tenant_id"] = tenant_id
            source_row = self.db.execute(source_query, source_params).fetchone()
            if not source_row:
                return []
            source_value = source_row[0]
            where_parts = [f"j.{j_src} = :source_value"]
            params = {"source_value": source_value}
            if rel.tenant_scope and tenant_id:
                where_parts.append("t.tenant_id = :tenant_id")
                params["tenant_id"] = tenant_id
                if self._has_tenant_column(junction):
                    where_parts.append("j.tenant_id = :tenant_id")
            query = text(
                f"SELECT t.* FROM {target_table} t "
                f"INNER JOIN {junction} j "
                f"ON j.{j_tgt} = t.{rel.target_column} "
                f"WHERE {' AND '.join(where_parts)} LIMIT 100"
            )
            rows = self.db.execute(query, params).fetchall()
            if not rows:
                return []
            return [dict(row._mapping) for row in rows]

'''
          if marker not in s:
              raise SystemExit('many_to_one insertion point not found')
          s = s.replace(marker, m2m + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

          cat > tests/test_relationship_m2m_tenant_isolation.py <<'PY'
          from types import SimpleNamespace

          from core.relationship_engine import RelationshipEngine


          class Result:
              def __init__(self, rows):
                  self.rows = rows

              def fetchone(self):
                  return self.rows[0] if self.rows else None

              def fetchall(self):
                  return self.rows


          class FakeDB:
              def __init__(self):
                  self.sql = []
                  self.calls = 0

              def execute(self, statement, params=None):
                  sql = str(statement)
                  self.sql.append((sql, params or {}))
                  self.calls += 1
                  if self.calls == 1:
                      return Result([('target_table',)])
                  return Result([])


          def test_m2m_nested_query_is_tenant_scoped():
              db = FakeDB()
              engine = RelationshipEngine(db)
              rel = {
                  'target_entity_code': 'roles',
                  'source_column': 'id',
                  'target_column': 'id',
                  'relationship_type': 'many_to_many',
                  'tenant_scope': True,
                  'junction_table': 'user_roles',
                  'junction_source_col': 'user_id',
                  'junction_target_col': 'role_id',
              }
              engine._has_tenant_column = lambda table: table == 'user_roles'
              engine._fetch_related_raw(rel, {'id': 'source-a'}, 'tenant-a')
              sql, params = db.sql[-1]
              assert 't.tenant_id = :tenant_id' in sql
              assert 'j.tenant_id = :tenant_id' in sql
              assert params['tenant_id'] == 'tenant-a'


          def test_m2m_query_never_uses_junction_key_without_target_tenant_filter():
              db = FakeDB()
              engine = RelationshipEngine(db)
              rel = {
                  'target_entity_code': 'roles',
                  'source_column': 'id',
                  'target_column': 'id',
                  'relationship_type': 'many_to_many',
                  'tenant_scope': True,
                  'junction_table': 'user_roles',
                  'junction_source_col': 'user_id',
                  'junction_target_col': 'role_id',
              }
              engine._has_tenant_column = lambda table: False
              engine._fetch_related_raw(rel, {'id': 'source-a'}, 'tenant-a')
              sql, params = db.sql[-1]
              assert 't.tenant_id = :tenant_id' in sql
              assert 'j.tenant_id = :tenant_id' not in sql
              assert params['tenant_id'] == 'tenant-a'
          PY

          python -m py_compile core/relationship_engine.py tests/test_relationship_m2m_tenant_isolation.py
          pytest -q tests/test_relationship_m2m_tenant_isolation.py

      - name: Commit and push repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/relationship_engine.py tests/test_relationship_m2m_tenant_isolation.py
          git diff --cached --quiet && exit 0
          git commit -m 'security: close M2M tenant leakage'
          git push origin HEAD:custom-erp-system-for-companies-24152
