name: Generate Frontend Lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: "github.event.head_commit.message != 'ci: generate canonical frontend lockfile'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate lockfile
        working-directory: erp-system/frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add erp-system/frontend/package-lock.json .github/workflows/generate_frontend_lock.yml
          git diff --cached --quiet && exit 0
          git rm .github/workflows/generate_frontend_lock.yml
          git commit -m 'ci: generate canonical frontend lockfile'
          git push origin HEAD:main
