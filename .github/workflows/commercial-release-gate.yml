name: EOS Commercial Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  production-contract:
    name: Production configuration contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify dependency consistency
        run: pip check
      - name: Verify Python compilation
        run: python -m compileall -q .
      - name: Validate production configuration contract
        env:
          ENVIRONMENT: production
          EOS_AUTH_MODE: production
          EOS_SECRET_KEY: production-contract-secret-key-1234567890abcdef
          DATABASE_URL: postgresql://eos:contract-password@127.0.0.1:5432/eos
          EOS_EMAIL_PROVIDER: smtp
          EOS_SMTP_HOST: smtp.example.com
          EOS_SMTP_USERNAME: contract-user
          EOS_SMTP_PASSWORD: contract-password
          EOS_FROM_EMAIL: noreply@example.com
          EOS_PAYMENT_MODE: stripe
          EOS_STRIPE_SECRET_KEY: sk_live_ci_9f7a6c3b2e1d4a8c
          EOS_FRONTEND_URL: https://app.example.com
          EOS_CORS_ORIGINS: '["https://app.example.com"]'
          EOS_ALLOWED_HOSTS: app.example.com,api.example.com
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: contract-password
          POSTGRES_DB: eos
          DOMAIN: example.com
        run: python -m core.production_config
      - name: Run hardened runtime tests
        env:
          ENVIRONMENT: test
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_runtime_config.py tests/test_enterprise_hardening_primitives.py tests/test_production_config.py --tb=short

  migration-contract:
    name: PostgreSQL migration contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
          POSTGRES_DB: eos_contract
        options: >-
          --health-cmd "pg_isready -U eos -d eos_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Require exactly one Alembic head before upgrade
        env:
          DATABASE_URL: postgresql://eos:eos@127.0.0.1:5432/eos_contract
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
        run: |
          alembic heads
          test "$(alembic heads | wc -l | tr -d ' ')" -eq 1
          test "$(alembic heads | grep -c '^20260909_finalize_tenant_rls')" -eq 1
      - name: Upgrade database to release head
        env:
          DATABASE_URL: postgresql://eos:eos@127.0.0.1:5432/eos_contract
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
        run: |
          alembic upgrade head
          test "$(alembic current | grep -c '20260909_finalize_tenant_rls')" -eq 1
      - name: Verify tenant RLS contract
        env:
          PGPASSWORD: eos
        run: |
          violations="$(psql -h 127.0.0.1 -U eos -d eos_contract -v ON_ERROR_STOP=1 -Atc "
            SELECT cols.table_name || ' relrowsecurity=' || c.relrowsecurity || ' relforcerowsecurity=' || c.relforcerowsecurity
            FROM information_schema.columns cols
            JOIN pg_class c ON c.relname = cols.table_name
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE cols.table_schema = 'public'
              AND n.nspname = 'public'
              AND cols.column_name = 'tenant_id'
              AND c.relkind IN ('r','p')
              AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity)
            ORDER BY cols.table_name;
          ")"
          if [ -n "$violations" ]; then
            echo 'Tenant RLS violations detected:'
            printf '%s\n' "$violations"
            exit 1
          fi
          echo 'Tenant RLS contract: PASS'
      - name: Verify migration idempotency
        env:
          DATABASE_URL: postgresql://eos:eos@127.0.0.1:5432/eos_contract
          SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          EOS_TEST_SECRET_KEY: test_secret_key_for_ci_only_12345678901234567890
          ENVIRONMENT: testing
        run: alembic upgrade head

  production-compose-contract:
    name: Production container / compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render and validate production compose
        env:
          POSTGRES_USER: eos_admin
          POSTGRES_PASSWORD: admin-password-contract
          POSTGRES_DB: eos
          EOS_DB_RUNTIME_USER: eos_runtime
          EOS_DB_RUNTIME_PASSWORD: runtime-password-contract
          EOS_DB_EXPORTER_USER: eos_exporter
          EOS_DB_EXPORTER_PASSWORD: exporter-password-contract
          EOS_SECRET_KEY: production-contract-secret-key-1234567890abcdef
          EOS_SMTP_HOST: smtp.example.com
          EOS_SMTP_USERNAME: contract-user
          EOS_SMTP_PASSWORD: contract-password
          EOS_FROM_EMAIL: noreply@example.com
          EOS_STRIPE_SECRET_KEY: sk_live_ci_9f7a6c3b2e1d4a8c
          EOS_FRONTEND_URL: https://app.example.com
          EOS_CORS_ORIGINS: '["https://app.example.com"]'
          EOS_ALLOWED_HOSTS: app.example.com,api.example.com
          DOMAIN: example.com
          GRAFANA_PASSWORD: grafana-password-contract
        run: |
          docker compose -f docker-compose.yml config --quiet
          rendered="$(docker compose -f docker-compose.yml config)"
          printf '%s\n' "$rendered" | grep -F 'eos_runtime:runtime-password-contract@db:5432/eos'
          printf '%s\n' "$rendered" | grep -F 'eos_exporter:exporter-password-contract@db:5432/eos'
          printf '%s\n' "$rendered" | grep -F 'service_completed_successfully'
          printf '%s\n' "$rendered" | grep -F '/app/docker/migrate-entrypoint.sh'
          printf '%s\n' "$rendered" | grep -F '/etc/nginx/templates/eos.conf.template:ro'
          printf '%s\n' "$rendered" | grep -F 'prometheuscommunity/postgres-exporter:v0.20.1'

  container-security:
    name: Container vulnerability and SBOM gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --pull -t eos:ci .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eos:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: eos:ci
          artifact-name: eos-sbom.spdx.json
          output-file: eos-sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-sbom
          path: eos-sbom.spdx.json
          if-no-files-found: error

  frontend-contract:
    name: Canonical frontend commercial build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-system/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: erp-system/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - name: Verify production artifact
        working-directory: .
        run: |
          test -f erp-system/frontend/dist/index.html
          test -n "$(find erp-system/frontend/dist/assets -type f | head -1)"
