name: One-time analytics tenant hardening
on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-erp-system-for-companies-24152
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Harden dashboard execution
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('core/analytics_engine.py')
          s=p.read_text()
          old='''    def execute_dashboard(self, dashboard_id: str):\n        dash = self.db.execute(text(\n            "SELECT id, dashboard_name, dashboard_type FROM dbp_dashboards WHERE id = :id"\n        ), {"id": dashboard_id}).mappings().first()'''
          new='''    def execute_dashboard(self, dashboard_id: str, tenant_id: str | None = None):\n        if tenant_id:\n            dash = self.db.execute(text(\n                "SELECT id, dashboard_name, dashboard_type FROM dbp_dashboards "\n                "WHERE id = :id AND (tenant_id = :tid OR tenant_id IS NULL)"\n            ), {"id": dashboard_id, "tid": tenant_id}).mappings().first()\n        else:\n            dash = self.db.execute(text(\n                "SELECT id, dashboard_name, dashboard_type FROM dbp_dashboards WHERE id = :id"\n            ), {"id": dashboard_id}).mappings().first()'''
          if old not in s:
              raise SystemExit('expected execute_dashboard block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python -m py_compile core/analytics_engine.py
      - name: Add execution regression
        run: |
          cat > tests/test_dashboard_execution_tenant_scope.py <<'PY'
          from unittest.mock import MagicMock
          from core.analytics_engine import AnalyticsEngine
          
          def test_execute_dashboard_accepts_tenant_scope():
              db=MagicMock()
              row=MagicMock()
              row.__getitem__.side_effect=lambda k: {'id':'d1','dashboard_name':'D','dashboard_type':'kpi'}[k]
              db.execute.return_value.mappings.return_value.first.return_value=row
              db.execute.return_value.fetchall.return_value=[]
              result=AnalyticsEngine(db).execute_dashboard('d1', tenant_id='tenant-a')
              assert result['id']=='d1'
              params=db.execute.call_args_list[0].args[1]
              assert params['tid']=='tenant-a'
          PY
          pytest -q tests/test_dashboard_execution_tenant_scope.py
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/harden_analytics_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/analytics_engine.py tests/test_dashboard_execution_tenant_scope.py .github/workflows/harden_analytics_once.yml
          git commit -m 'security: scope dashboard execution by tenant'
          git push origin custom-erp-system-for-companies-24152