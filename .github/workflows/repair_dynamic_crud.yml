name: Repair Dynamic CRUD Tenant Scope

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor == 'credit-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore full Dynamic CRUD and apply security patch
        shell: bash
        run: |
          git checkout 4111e9ad5cf194bfbb14b14fe4c2f2654e5c5b9f -- routers/dynamic_crud.py
          python - <<'PY'
          from pathlib import Path
          p = Path('routers/dynamic_crud.py')
          s = p.read_text(encoding='utf-8')

          old = '''def get_verification_engine(\n    entity_code: str,\n    db: Session = Depends(get_db)\n):\n    return DynamicVerificationEngine(db, entity_code)'''
          new = '''def get_verification_engine(\n    entity_code: str,\n    db: Session = Depends(get_db),\n    current_user: Optional[dict] = Depends(optional_get_current_user),\n):\n    tenant_id = current_user.get("tenant_id") if current_user else None\n    return DynamicVerificationEngine(db, entity_code, tenant_id=tenant_id)'''
          if old not in s: raise SystemExit('helper pattern not found')
          s = s.replace(old, new, 1)

          old = '''    ent_row = db.execute(\n        text(\n            "SELECT id, table_mapping FROM dbp_entities "\n            "WHERE code = :code"\n        ),\n        {"code": entity_code}\n    ).fetchone()'''
          new = '''    tenant_id = current_user.get("tenant_id") if current_user else None\n    ent_sql = "SELECT id, table_mapping, tenant_id FROM dbp_entities WHERE code = :code"\n    ent_params = {"code": entity_code}\n    if tenant_id:\n        ent_sql += " AND (tenant_id = :tenant_id OR tenant_id IS NULL)"\n        ent_params["tenant_id"] = tenant_id\n    else:\n        ent_sql += " AND tenant_id IS NULL"\n    ent_row = db.execute(text(ent_sql), ent_params).fetchone()'''
          if old not in s: raise SystemExit('list lookup pattern not found')
          s = s.replace(old, new, 1)

          s = s.replace('''    entity_id = ent_row[0]\n    table_mapping = ent_row[1]''', '''    entity_id = ent_row[0]\n    table_mapping = ent_row[1]''', 1)

          old = '''        ent_row = db.execute(\n            text("SELECT id FROM dbp_entities WHERE code = :code"),\n            {"code": entity_code}\n        ).fetchone()'''
          new = '''        ent_sql = "SELECT id FROM dbp_entities WHERE code = :code"\n        ent_params = {"code": entity_code}\n        if tenant_id:\n            ent_sql += " AND (tenant_id = :tenant_id OR tenant_id IS NULL)"\n            ent_params["tenant_id"] = tenant_id\n        else:\n            ent_sql += " AND tenant_id IS NULL"\n        ent_row = db.execute(text(ent_sql), ent_params).fetchone()'''
          if old not in s: raise SystemExit('include source lookup pattern not found')
          s = s.replace(old, new, 1)

          old = '''                tgt_row = db.execute(\n                    text(\n                        "SELECT table_mapping FROM dbp_entities "\n                        "WHERE code = :code"\n                    ),\n                    {"code": rel_data["target_entity_code"]}\n                ).fetchone()'''
          new = '''                tgt_sql = "SELECT table_mapping FROM dbp_entities WHERE code = :code"\n                tgt_params = {"code": rel_data["target_entity_code"]}\n                if tenant_id:\n                    tgt_sql += " AND (tenant_id = :tenant_id OR tenant_id IS NULL)"\n                    tgt_params["tenant_id"] = tenant_id\n                else:\n                    tgt_sql += " AND tenant_id IS NULL"\n                tgt_row = db.execute(text(tgt_sql), tgt_params).fetchone()'''
          if old not in s: raise SystemExit('include target lookup pattern not found')
          s = s.replace(old, new, 1)

          # Harden delete's metadata resolution if present in the restored file.
          old = '''    ent = db.execute(\n        text(\n            "SELECT table_mapping FROM dbp_entities "\n            "WHERE code = :code"\n        ),\n        {"code": entity_code}\n    ).fetchone()'''
          new = '''    ent_sql = "SELECT table_mapping FROM dbp_entities WHERE code = :code"\n    ent_params = {"code": entity_code}\n    if tenant_id:\n        ent_sql += " AND (tenant_id = :tenant_id OR tenant_id IS NULL)"\n        ent_params["tenant_id"] = tenant_id\n    else:\n        ent_sql += " AND tenant_id IS NULL"\n    ent = db.execute(text(ent_sql), ent_params).fetchone()'''
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile
        run: python -m py_compile routers/dynamic_crud.py core/dynamic_verification.py

      - name: Install tests
        run: python -m pip install --upgrade pip pytest fastapi sqlalchemy psycopg2-binary

      - name: Mandatory Dynamic CRUD security tests
        run: PYTHONPATH=. pytest -q tests/test_dynamic_crud_tenant_security.py

      - name: Existing security and ERP tests
        run: PYTHONPATH=. pytest -q tests/test_tenant_scope.py tests/test_e2e_erp_generation.py tests/test_composer_builder_e2e.py

      - name: Commit repaired full router
        run: |
          git config user.name 'credit-manager'
          git config user.email 'fc.creditmanager@gmail.com'
          git add routers/dynamic_crud.py
          git diff --cached --quiet || git commit -m 'security: restore and tenant-scope Dynamic CRUD'
          git push origin main

      - name: Remove one-shot repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair_dynamic_crud.yml
          git commit -m 'chore: remove one-shot repair workflow'
          git push origin main
