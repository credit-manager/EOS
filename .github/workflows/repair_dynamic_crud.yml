name: One Shot Analytics Hardening

on:
  push:
    branches:
      - custom-erp-system-for-companies-24152

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-erp-system-for-companies-24152
          fetch-depth: 0
      - name: Harden analytics tenant SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('core/analytics_engine.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def _execute_query(')
          end = s.index('\n\ndef _execute_scalar(', start)
          helper = '''def _execute_query(sql: str, params: dict | None = None, tenant_id: str | None = None) -> list[dict]:
              """Execute analytics SQL with tenant values passed as bound parameters."""
              db = SessionLocal()
              try:
                  bound_params = dict(params or {})
                  if tenant_id:
                      # Legacy query builders may already have rendered the tenant value.
                      # Replace only the exact value supplied to this execution boundary.
                      for alias in ('', 'c.', 's.'):
                          sql = sql.replace(f"{alias}tenant_id = '{tenant_id}'", f"{alias}tenant_id = :_tid")
                      bound_params["_tid"] = tenant_id
                  result = db.execute(text(sql), bound_params)
                  return [dict(row._mapping) for row in result]
              except Exception as e:
                  logger.error("Analytics query failed: %s", e)
                  return []
              finally:
                  db.close()
          '''
          s = s[:start] + helper + s[end:]
          dstart = s.index('def drill_down(')
          dend = s.index('\n\n# ═══════════════════════════════════════════════════════════════', dstart)
          drill = '''def drill_down(tenant_id: str, entity_type: str, entity_id: str) -> dict[str, Any]:
              """Drill-down from KPI to source documents using bound parameters."""
              db = SessionLocal()
              queries = {
                  "invoice": "SELECT * FROM dbp_sales_invoices WHERE id = :entity_id AND tenant_id = :tenant_id",
                  "purchase_order": "SELECT * FROM dbp_purchase_orders WHERE id = :entity_id AND tenant_id = :tenant_id",
                  "project": "SELECT * FROM dbp_projects WHERE id = :entity_id AND tenant_id = :tenant_id",
                  "payment": "SELECT * FROM dbp_payments WHERE id = :entity_id AND tenant_id = :tenant_id",
              }
              try:
                  sql = queries.get(entity_type)
                  if not sql:
                      return {}
                  row = db.execute(text(sql), {"entity_id": entity_id, "tenant_id": tenant_id}).mappings().first()
                  return dict(row) if row else {}
              finally:
                  db.close()
          '''
          s = s[:dstart] + drill + s[dend:]
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile core/analytics_engine.py
          git config user.name 'credit-manager'
          git config user.email 'fc.creditmanager@gmail.com'
          git add core/analytics_engine.py
          git commit -m 'security: bind analytics tenant parameters'
          git push origin custom-erp-system-for-companies-24152
      - name: Remove temporary runner from main
        run: |
          git fetch origin main
          git checkout main
          git rm .github/workflows/repair_dynamic_crud.yml
          git config user.name 'credit-manager'
          git config user.email 'fc.creditmanager@gmail.com'
          git commit -m 'chore: remove one-shot analytics runner'
          git push origin main
