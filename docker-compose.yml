# EOS Dynamic Business Platform — secure production compose baseline
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [eos-network]
    expose: ["5432"]

  api:
    build: {context: ., dockerfile: Dockerfile}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EOS_AUTH_MODE: production
      EOS_ENVIRONMENT: production
      EOS_SECRET_KEY: ${EOS_SECRET_KEY:?set EOS_SECRET_KEY}
      EOS_2FA_ENCRYPTION_KEY: ${EOS_2FA_ENCRYPTION_KEY:?set EOS_2FA_ENCRYPTION_KEY}
      EOS_EMAIL_PROVIDER: ${EOS_EMAIL_PROVIDER:?set EOS_EMAIL_PROVIDER}
      EOS_SMTP_HOST: ${EOS_SMTP_HOST:?set EOS_SMTP_HOST}
      EOS_SMTP_PORT: ${EOS_SMTP_PORT:-587}
      EOS_SMTP_USERNAME: ${EOS_SMTP_USERNAME:?set EOS_SMTP_USERNAME}
      EOS_SMTP_PASSWORD: ${EOS_SMTP_PASSWORD:?set EOS_SMTP_PASSWORD}
      EOS_FROM_EMAIL: ${EOS_FROM_EMAIL:?set EOS_FROM_EMAIL}
      EOS_PAYMENT_MODE: ${EOS_PAYMENT_MODE:-disabled}
      EOS_STRIPE_SECRET_KEY: ${EOS_STRIPE_SECRET_KEY:-}
      EOS_FRONTEND_URL: ${EOS_FRONTEND_URL:?set EOS_FRONTEND_URL}
      EOS_CORS_ORIGINS: ${EOS_CORS_ORIGINS:?set EOS_CORS_ORIGINS}
      EOS_ALLOWED_HOSTS: ${EOS_ALLOWED_HOSTS:?set EOS_ALLOWED_HOSTS}
      EOS_TRUSTED_HOSTS_ENABLED: "true"
      EOS_DISABLE_DOCS: "true"
      EOS_RATE_LIMIT_FAIL_CLOSED: "true"
      EOS_TRUSTED_PROXIES: ${EOS_TRUSTED_PROXIES:?set EOS_TRUSTED_PROXIES}
      EOS_RUNTIME_SCHEMA: "false"
      EOS_METRICS_TOKEN: ${EOS_METRICS_TOKEN:?set EOS_METRICS_TOKEN}
      EOS_HEALTH_TOKEN: ${EOS_HEALTH_TOKEN:?set EOS_HEALTH_TOKEN}
      EOS_OTEL_ENABLED: ${EOS_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DOMAIN: ${DOMAIN:?set DOMAIN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [eos-network]
    expose: ["8000"]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api: {condition: service_healthy}
    networks: [eos-network]

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks: [eos-network]
    expose: ["9090"]

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:?set GRAFANA_URL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on: [prometheus]
    networks: [eos-network]
    expose: ["3000"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  eos-network:
    driver: bridge
