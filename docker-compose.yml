services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eos
      POSTGRES_USER: eos
      POSTGRES_PASSWORD: eos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eos -d eos"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://eos:eos@postgres:5432/eos
      APP_ENV: production
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
