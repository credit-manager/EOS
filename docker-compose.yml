# EOS Dynamic Business Platform — Production Docker Compose
# Usage: docker compose -f docker-compose.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: eos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      EOS_DB_RUNTIME_USER: ${EOS_DB_RUNTIME_USER:?EOS_DB_RUNTIME_USER is required}
      EOS_DB_RUNTIME_PASSWORD: ${EOS_DB_RUNTIME_PASSWORD:?EOS_DB_RUNTIME_PASSWORD is required}
      EOS_DB_EXPORTER_USER: ${EOS_DB_EXPORTER_USER:?EOS_DB_EXPORTER_USER is required}
      EOS_DB_EXPORTER_PASSWORD: ${EOS_DB_EXPORTER_PASSWORD:?EOS_DB_EXPORTER_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [eos-network]
    expose: ["5432"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eos-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EOS_AUTH_MODE: production
      EOS_ALGORITHM: ${EOS_ALGORITHM:-HS256}
      EOS_JWT_PRIVATE_KEY: ${EOS_JWT_PRIVATE_KEY:-}
      EOS_JWT_PUBLIC_KEY: ${EOS_JWT_PUBLIC_KEY:-}
      EOS_SECRET_KEY: ${EOS_SECRET_KEY:-}
      EOS_DB_RUNTIME_USER: ${EOS_DB_RUNTIME_USER:?EOS_DB_RUNTIME_USER is required}
      EOS_DB_RUNTIME_PASSWORD: ${EOS_DB_RUNTIME_PASSWORD:?EOS_DB_RUNTIME_PASSWORD is required}
      EOS_DB_EXPORTER_USER: ${EOS_DB_EXPORTER_USER:?EOS_DB_EXPORTER_USER is required}
      EOS_DB_EXPORTER_PASSWORD: ${EOS_DB_EXPORTER_PASSWORD:?EOS_DB_EXPORTER_PASSWORD is required}
    entrypoint: ["/app/docker/migrate-entrypoint.sh"]
    networks: [eos-network]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eos-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${EOS_DB_RUNTIME_USER}:${EOS_DB_RUNTIME_PASSWORD}@db:5432/${POSTGRES_DB}
      EOS_AUTH_MODE: production
      EOS_SECRET_KEY: ${EOS_SECRET_KEY:-}
      EOS_ALGORITHM: ${EOS_ALGORITHM:-HS256}
      EOS_JWT_PRIVATE_KEY: ${EOS_JWT_PRIVATE_KEY:-}
      EOS_JWT_PUBLIC_KEY: ${EOS_JWT_PUBLIC_KEY:-}
      EOS_JWT_ISSUER: ${EOS_JWT_ISSUER:-eos-dbp}
      EOS_JWT_AUDIENCE: ${EOS_JWT_AUDIENCE:-eos-api}
      EOS_TOKEN_EXPIRE_MINUTES: ${EOS_TOKEN_EXPIRE_MINUTES:-30}
      EOS_EMAIL_PROVIDER: ${EOS_EMAIL_PROVIDER:-smtp}
      EOS_SMTP_HOST: ${EOS_SMTP_HOST:?EOS_SMTP_HOST is required}
      EOS_SMTP_PORT: ${EOS_SMTP_PORT:-587}
      EOS_SMTP_USERNAME: ${EOS_SMTP_USERNAME:?EOS_SMTP_USERNAME is required}
      EOS_SMTP_PASSWORD: ${EOS_SMTP_PASSWORD:?EOS_SMTP_PASSWORD is required}
      EOS_FROM_EMAIL: ${EOS_FROM_EMAIL:?EOS_FROM_EMAIL is required}
      EOS_FROM_NAME: ${EOS_FROM_NAME:-EOS Platform}
      EOS_PAYMENT_MODE: ${EOS_PAYMENT_MODE:-stripe}
      EOS_STRIPE_SECRET_KEY: ${EOS_STRIPE_SECRET_KEY:?EOS_STRIPE_SECRET_KEY is required}
      EOS_FRONTEND_URL: ${EOS_FRONTEND_URL:?EOS_FRONTEND_URL is required}
      EOS_CORS_ORIGINS: ${EOS_CORS_ORIGINS:?EOS_CORS_ORIGINS is required}
      EOS_ALLOWED_HOSTS: ${EOS_ALLOWED_HOSTS:?EOS_ALLOWED_HOSTS is required}
      EOS_METRICS_ENABLED: ${EOS_METRICS_ENABLED:-false}
      EOS_ENABLE_DOCS: ${EOS_ENABLE_DOCS:-false}
      EOS_LOG_LEVEL: ${EOS_LOG_LEVEL:-info}
      EOS_LOG_FORMAT: ${EOS_LOG_FORMAT:-json}
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [eos-network]
    expose: ["8000"]

  nginx:
    image: nginx:stable-alpine3.24
    container_name: eos-nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/eos.conf:/etc/nginx/eos.conf.template:ro
      - ./docker/nginx-entrypoint.sh:/usr/local/bin/eos-nginx-entrypoint.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    entrypoint: ["/usr/local/bin/eos-nginx-entrypoint.sh"]
    depends_on:
      api:
        condition: service_healthy
    networks: [eos-network]

  certbot:
    image: certbot/certbot:v5.8.0
    container_name: eos-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: eos-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks: [eos-network]

  grafana:
    image: grafana/grafana:13.2.1
    container_name: eos-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on: [prometheus]
    networks: [eos-network]

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: eos-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks: [eos-network]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: eos-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${EOS_DB_EXPORTER_USER}:${EOS_DB_EXPORTER_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    expose: ["9187"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [eos-network]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: eos-node-exporter
    restart: unless-stopped
    expose: ["9100"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks: [eos-network]

  loki:
    image: grafana/loki:3.7.4
    container_name: eos-loki
    restart: unless-stopped
    expose: ["3100"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [eos-network]

  promtail:
    image: grafana/promtail:3.7.4
    container_name: eos-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]
    networks: [eos-network]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  promtail_positions:

networks:
  eos-network:
    driver: bridge
