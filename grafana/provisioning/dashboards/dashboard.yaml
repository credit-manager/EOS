# Grafana Dashboard Provisioning
# Place in: grafana/provisioning/dashboards/dashboard.yaml

apiVersion: 1

providers:
  - name: 'EOS Dashboards'
    orgId: 1
    folder: 'EOS'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards