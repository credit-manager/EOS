global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ─────────────────────────────────────
  # EOS FastAPI Application
  # ─────────────────────────────────────
  - job_name: "eos-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "eos-api"
          environment: "production"

  # ─────────────────────────────────────
  # Prometheus Self-Monitoring
  # ─────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # ─────────────────────────────────────
  # Node Exporter — Host Metrics
  # ─────────────────────────────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          instance: "eos-server"

  # ─────────────────────────────────────
  # PostgreSQL Exporter — DB Metrics
  # ─────────────────────────────────────
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres-exporter"
          instance: "eos-db"

  # ─────────────────────────────────────
  # Nginx Exporter (if enabled)
  # ─────────────────────────────────────
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:9113"]
        labels:
          service: "nginx"
    # Optional: uncomment if nginx-prometheus-exporter is added
    # scrape_interval: 10s