groups:
  # ═══════════════════════════════════════════════
  # EOS API Alerts
  # ═══════════════════════════════════════════════
  - name: eos_api
    rules:
      # ── API DOWN ──
      - alert: EosApiDown
        expr: up{job="eos-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "🔴 EOS API is DOWN"
          description: "EOS FastAPI has been unreachable for >1 minute."
          runbook: "Check docker logs eos-api, restart if needed."

      # ── High Error Rate ──
      - alert: EosHighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          / sum(rate(http_requests_total[5m])) > 0.05
        for: 3m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "⚠️ High 5xx error rate"
          description: "5xx errors > 5% of traffic for 3 minutes (current: {{ $value | humanizePercentage }})"
          runbook: "Check recent deployments, API logs, and database connectivity."

      # ── High 4xx Rate ──
      - alert: EosHigh4xxRate
        expr: |
          sum(rate(http_requests_total{status_code=~"4.."}[5m]))
          / sum(rate(http_requests_total[5m])) > 0.20
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "⚠️ High 4xx error rate"
          description: "4xx errors > 20% of traffic for 5 minutes (current: {{ $value | humanizePercentage }})"
          runbook: "Possible client misconfiguration or authentication issue."

      # ── High Latency ──
      - alert: EosHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "⚠️ High API latency (p95)"
          description: "p95 latency > 2s for 5 minutes (current: {{ $value | humanize }})"
          runbook: "Check database queries, slow endpoints, and resource usage."

      # ── Critical Latency ──
      - alert: EosCriticalLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "🔴 Critical API latency (p99)"
          description: "p99 latency > 5s for 3 minutes (current: {{ $value | humanize }})"
          runbook: "Immediate investigation required. Check DB locks, slow queries."

  # ═══════════════════════════════════════════════
  # Database Alerts
  # ═══════════════════════════════════════════════
  - name: eos_database
    rules:
      # ── PostgreSQL DOWN ──
      - alert: EosPostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "🔴 PostgreSQL is DOWN"
          description: "PostgreSQL has been unreachable for >1 minute."
          runbook: "Check docker logs eos-db, verify disk space, check pg_isready."

      # ── High Connection Usage ──
      - alert: EosHighDbConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.85
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "⚠️ High DB connection usage"
          description: "DB connections > 85% of max (current: {{ $value | humanizePercentage }})"
          runbook: "Check for connection leaks, consider increasing max_connections."

      # ── Deadlocks ──
      - alert: EosDbDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "⚠️ Database deadlock detected"
          description: "{{ $value }} deadlock(s) in the last 5 minutes."
          runbook: "Review transaction logic, check for long-running queries."

      # ── DB Query Latency ──
      - alert: EosHighDbLatency
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "⚠️ High DB query latency"
          description: "p95 DB query latency > 1s for 5 minutes."
          runbook: "Check for missing indexes, slow queries, table bloat."

  # ═══════════════════════════════════════════════
  # System / Host Alerts
  # ═══════════════════════════════════════════════
  - name: eos_system
    rules:
      # ── High CPU ──
      - alert: EosHighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "⚠️ High CPU usage"
          description: "CPU usage > 85% for 5 minutes (current: {{ $value | humanize }}%)"
          runbook: "Check top processes, identify workload, consider scaling."

      # ── High Memory ──
      - alert: EosHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "⚠️ High memory usage"
          description: "Memory usage > 90% for 5 minutes (current: {{ $value | humanize }}%)"
          runbook: "Check for memory leaks, review application memory usage."

      # ── Disk Full ──
      - alert: EosDiskFull
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "🔴 Disk almost full"
          description: "Disk usage > 90% (current: {{ $value | humanize }}%). Risk of data loss."
          runbook: "Clean old logs, rotate backups, check for large files."

      # ── Disk Almost Full Warning ──
      - alert: EosDiskWarning
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "⚠️ Disk usage high"
          description: "Disk usage > 80% (current: {{ $value | humanize }}%)"
          runbook: "Review disk usage, plan cleanup or expansion."

  # ═══════════════════════════════════════════════
  # SSL & Security Alerts
  # ═══════════════════════════════════════════════
  - name: eos_ssl
    rules:
      # ── SSL Expiry Warning (7 days) ──
      - alert: EosSslExpiryWarning
        expr: (certificate_expiration_timestamp_seconds - time()) / 86400 < 7
        for: 1h
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "⚠️ SSL certificate expiring soon"
          description: "SSL certificate expires in {{ $value | humanize }} days."
          runbook: "Run: certbot renew, check auto-renewal cron."

      # ── SSL Expiry Critical (2 days) ──
      - alert: EosSslExpiryCritical
        expr: (certificate_expiration_timestamp_seconds - time()) / 86400 < 2
        for: 1h
        labels:
          severity: critical
          service: ssl
        annotations:
          summary: "🔴 SSL certificate expiring very soon"
          description: "SSL certificate expires in {{ $value | humanize }} days!"
          runbook: "URGENT: Renew certificate immediately."

  # ═══════════════════════════════════════════════
  # Backup Alerts
  # ═══════════════════════════════════════════════
  - name: eos_backup
    rules:
      # ── Backup Failed ──
      - alert: EosBackupFailed
        expr: backup_status{status="failed"} == 1
        for: 0m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "🔴 Database backup failed"
          description: "The latest backup attempt failed. Data may be at risk."
          runbook: "Check backup.sh logs, verify disk space, check PostgreSQL."

      # ── Backup Stale (no backup in 24h) ──
      - alert: EosBackupStale
        expr: (time() - backup_last_success_timestamp) > 86400
        for: 0m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "⚠️ No successful backup in 24 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago."
          runbook: "Check backup cron, verify backup script runs correctly."

  # ═══════════════════════════════════════════════
  # Auth & Security Alerts
  # ═══════════════════════════════════════════════
  - name: eos_auth
    rules:
      # ── High Failed Login Rate ──
      - alert: EosHighFailedLogins
        expr: rate(auth_logins_total{status="failed"}[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          service: auth
        annotations:
          summary: "⚠️ High failed login rate"
          description: "Failed logins > 0.1/sec for 3 minutes. Possible brute force."
          runbook: "Check for suspicious IPs, consider rate limiting."

      # ── Auth Service Issues ──
      - alert: EosAuthServiceDown
        expr: rate(auth_logins_total{status="success"}[5m]) == 0 and rate(auth_logins_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: auth
        annotations:
          summary: "🔴 All logins failing"
          description: "No successful logins for 5 minutes while login attempts continue."
          runbook: "Check auth configuration, JWT secret, database connectivity."]